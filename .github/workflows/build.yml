name: Build PS2 ELF and ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with ps2dev
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src ps2dev/ps2dev:latest sh -c "make clean && make all && (make iso || true)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BALDI-PS2-DELUXE
          path: |
            BALDI.ELF
            BALDI_PS2.ISO
