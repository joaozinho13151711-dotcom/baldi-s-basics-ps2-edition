name: Build PS2 ELF and ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with ps2dev
        uses: ps2dev/ps2dev-docker@latest
        with:
          command: |
            make clean
            make all
            make iso || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BALDI-PS2-DELUXE
          path: |
            BALDI.ELF
            BALDI_PS2.ISO
